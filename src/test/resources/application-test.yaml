spring:
  datasource:
    url: jdbc:h2:mem:taller360;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    secret: Taller360JwtSecretKeyForTestingOnly123456789012345
    expiration-seconds: 3600
