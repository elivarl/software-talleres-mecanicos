<header class="topbar app-surface">
  <div class="topbar__brand">
    <p-button
      icon="pi pi-bars"
      variant="text"
      severity="secondary"
      ariaLabel="Abrir navegación"
      (onClick)="onMenuButtonClick()"
    />

    <div>
      <p class="topbar__eyebrow">Taller360</p>
      <h2 class="topbar__title">Panel administrativo del taller</h2>
    </div>
  </div>

  <div class="topbar__actions">
    <div class="topbar__status">
      <span class="topbar__status-dot"></span>
      <span>Sesión activa</span>
    </div>

    <div class="topbar__user">
      <span class="topbar__user-avatar">
        <i class="pi pi-user"></i>
      </span>
      <div>
        <strong>{{ userName() }}</strong>
        <small>{{ userRole() }}</small>
      </div>
    </div>

    <p-button
      label="Salir"
      icon="pi pi-sign-out"
      severity="secondary"
      [outlined]="true"
      (onClick)="logout()"
    />
  </div>
</header>
