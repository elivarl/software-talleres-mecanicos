<aside class="sidebar" [class.sidebar--open]="open()">
  <div class="sidebar__header">
    <a routerLink="/dashboard" class="sidebar__logo" (click)="onNavigate()">
      <span class="sidebar__logo-mark">T</span>
      <div>
        <strong>Taller360</strong>
        <p>Panel administrativo</p>
      </div>
    </a>
  </div>

  <div class="sidebar__content">
    <p-panelmenu [model]="menuItems()" styleClass="sidebar__menu" />
  </div>

  <footer class="sidebar__footer">
    <p>Frontend MVP</p>
    <small>Base lista para continuar con los siguientes módulos operativos del taller.</small>
  </footer>
</aside>
