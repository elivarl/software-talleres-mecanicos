<section class="app-page">
  <app-page-header
    [title]="'Taller360 listo para construir'"
    [subtitle]="'La fase 1A deja la base técnica preparada con Angular, Router, HttpClient y PrimeNG para avanzar al flujo operativo del taller.'"
  >
    <p-button
      label="Próxima fase"
      icon="pi pi-arrow-right"
      severity="contrast"
      [outlined]="true"
    />
  </app-page-header>

  <div class="app-grid app-grid--stats">
    @for (stat of stats; track stat.label) {
      <app-stat-card
        [label]="stat.label"
        [value]="stat.value"
        [helper]="stat.helper"
        [icon]="stat.icon"
        [severity]="stat.severity ?? 'info'"
      />
    }
  </div>

  <div class="dashboard-home__content">
    <p-card header="Resumen de esta base" subheader="Configuración inicial del frontend">
      <div class="dashboard-home__summary">
        <p>
          La navegación principal ya usa una shell con sidebar y topbar. Los siguientes módulos
          podrán integrarse sin rehacer la estructura del proyecto.
        </p>

        <div class="dashboard-home__meta">
          <div>
            <span class="dashboard-home__meta-label">Backend API URL</span>
            <strong>{{ backendApiUrl }}</strong>
          </div>
          <p-tag severity="success" value="Compilable" />
        </div>
      </div>
    </p-card>

    <p-card header="Siguientes pasos sugeridos" subheader="Orden recomendado para continuar">
      <ol class="dashboard-home__steps">
        @for (step of nextSteps; track step) {
          <li>{{ step }}</li>
        }
      </ol>
    </p-card>
  </div>
</section>
