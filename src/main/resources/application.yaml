spring:
  application:
    name: taller360
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taller360?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Guayaquil}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  error:
    whitelabel:
      enabled: false

app:
  tax-rate: ${APP_TAX_RATE:0.15}
  jwt:
    secret: ${JWT_SECRET:Taller360JwtSecretKeyForDevelopmentOnly1234567890}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
