  /api/work-orders:
    get:
      tags: [Work Orders]
      operationId: listWorkOrders
      summary: List work orders
      description: Requires ADMIN, RECEPTIONIST or MECHANIC role.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/WorkOrderStatus'
        - name: plate
          in: query
          required: false
          schema:
            type: string
        - name: customerId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: receptionDateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: receptionDateTo
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Work orders found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
