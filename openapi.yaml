components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Usar `Authorization: Bearer <accessToken>`.'
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PartId:
      name: partId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    LaborId:
      name: laborId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: Validation or business rule error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: Duplicate or conflicting data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    ApiErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        validationErrors:
          type: array
          items:
            type: string
      example:
        timestamp: '2026-05-21T10:00:00'
        status: 400
        error: Bad Request
        message: Validation failed
        path: /api/work-orders/1/deliver
        validationErrors:
          - deliveredTo: Delivered to is required
    UserRole:
      type: string
      enum: [ADMIN, RECEPTIONIST, MECHANIC]
    WorkOrderStatus:
      type: string
      enum: [RECEIVED, DIAGNOSIS, QUOTED, APPROVED, REJECTED, IN_PROGRESS, READY, DELIVERED, CANCELLED]
    QuotationStatus:
      type: string
      enum: [DRAFT, SENT, APPROVED, REJECTED, EXPIRED]
    QuotationItemType:
      type: string
      enum: [PART, LABOR]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      example:
        email: admin@taller360.com
        password: Admin12345*
    AuthenticatedUserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/AuthenticatedUserResponse'
      example:
        accessToken: eyJhbGciOiJIUzI1NiJ9.example
        tokenType: Bearer
        expiresIn: 3600
        user:
          id: 1
          fullName: Admin Taller360
          email: admin@taller360.com
          role: ADMIN
    CreateUserRequest:
      type: object
      required: [fullName, email, password, role]
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
    UpdateUserRequest:
      type: object
      required: [fullName, email, role, active]
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateCustomerRequest:
      type: object
      required: [fullName, phone]
      properties:
        fullName:
          type: string
          maxLength: 150
        identification:
          type: string
          maxLength: 50
        phone:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 150
        address:
          type: string
          maxLength: 255
      example:
