openapi: 3.1.0
info:
  title: Taller360 Backend API
  version: 0.0.1-SNAPSHOT
  description: >
    Contrato OpenAPI generado a partir del codigo implementado actualmente en el backend de Taller360.
    Documenta autenticacion JWT, usuarios, clientes, vehiculos, work orders, inspecciones,
    cotizaciones privadas y publicas, inventario, repuestos usados, mano de obra,
    historial del vehiculo y dashboard.
    Los endpoints privados usan JWT Bearer y los endpoints publicos de cotizacion no requieren autenticacion.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Auth
    description: Inicio de sesion y emision de JWT.
  - name: Users
    description: Administracion de usuarios internos del sistema.
  - name: Customers
    description: Gestion de clientes propietarios o responsables del vehiculo.
  - name: Vehicles
    description: Registro de vehiculos e historial consolidado.
  - name: Work Orders
    description: Flujo operativo principal del taller.
  - name: Inspections
    description: Inspeccion inicial y fotos simuladas de recepcion.
  - name: Quotations
    description: Cotizaciones privadas administradas por el taller.
  - name: Public Quotations
    description: Consulta y decision publica de cotizaciones por token.
  - name: Inventory
    description: Catalogo de items de inventario y stock.
  - name: Used Parts
    description: Repuestos usados registrados por orden de trabajo.
  - name: Labor
    description: Mano de obra asociada a una orden de trabajo.
  - name: Dashboard
    description: Resumen operativo del taller.
security:
  - BearerAuth: []
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Authenticate a user and issue a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      description: Requires ADMIN role.
      responses:
        '200':
          description: Users found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user
      description: Requires ADMIN role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/users/{id}:
    get:
      tags: [Users]
      operationId: getUserById
      summary: Get a user by id
      description: Requires ADMIN role.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      operationId: updateUser
      summary: Update a user
      description: Requires ADMIN role.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/users/{id}/deactivate:
    patch:
      tags: [Users]
      operationId: deactivateUser
      summary: Deactivate a user
      description: Requires ADMIN role.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: User deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: List customers
      description: Requires ADMIN or RECEPTIONIST role.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search by full name, identification or phone
      responses:
        '200':
          description: Customers found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      description: Requires ADMIN or RECEPTIONIST role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/customers/{id}:
    get:
      tags: [Customers]
      operationId: getCustomerById
      summary: Get a customer by id
      description: Requires ADMIN or RECEPTIONIST role.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
