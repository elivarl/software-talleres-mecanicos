      tags: [Work Orders]
      operationId: createWorkOrder
      summary: Create a work order
      description: Requires ADMIN or RECEPTIONIST role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkOrderRequest'
      responses:
