        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Inspections]
      operationId: getReceptionInspectionByWorkOrderId
      summary: Get reception inspection by work order id
      description: Requires ADMIN, RECEPTIONIST or MECHANIC role.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Inspection found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceptionInspectionResponse'
        '401':
