          description: Work order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/work-orders/{id}:
    get:
      tags: [Work Orders]
      operationId: getWorkOrderById
      summary: Get a work order by id
      description: Requires ADMIN, RECEPTIONIST or MECHANIC role.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Work order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/work-orders/{id}/assign-mechanic:
    patch:
      tags: [Work Orders]
      operationId: assignMechanic
      summary: Assign mechanic to work order
      description: Requires ADMIN or RECEPTIONIST role.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignMechanicRequest'
      responses:
        '200':
          description: Work order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/work-orders/{id}/status:
    patch:
      tags: [Work Orders]
      operationId: updateWorkOrderStatus
      summary: Update work order status
      description: Requires ADMIN or RECEPTIONIST role.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkOrderStatusRequest'
      responses:
